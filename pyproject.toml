[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthops-fhir-canada"
version = "0.1.0"
description = "Healthcare data quality and implementation portfolio platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Alvaro Portilla" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100